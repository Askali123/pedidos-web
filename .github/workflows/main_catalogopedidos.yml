
name: Build and deploy ASP.Net Core app to Azure Web App - catalogopedidos

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore src/CatalogoPedidos.Web/CatalogoPedidos.Web.csproj

      - name: Build
        run: dotnet build src/CatalogoPedidos.Web/CatalogoPedidos.Web.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish src/CatalogoPedidos.Web/CatalogoPedidos.Web.csproj -c Release --no-restore -o ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: catalogopedidos-app
          path: ./publish

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: catalogopedidos-app
          path: ./publish

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'catalogopedidos'
          slot-name: 'Production'
          package: ./publish

